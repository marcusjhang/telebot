[build]
builder = "NIXPACKS"
buildCommand = "cd backend && pip install poetry && poetry install --no-dev"

[deploy]
startCommand = "cd backend && poetry run alembic upgrade head && poetry run uvicorn app.main:app --host 0.0.0.0 --port $PORT & poetry run rq worker --url $REDIS_URL broadcasts"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

